name: CI Mobile

on:
  push:
    branches: ['dev', 'main']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: ['dev', 'main']
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/ci-mobile.yml'

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (flutter analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/coach_in
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the Flutter version used locally; newer stable
          # releases add deprecation infos that fail `flutter analyze`.
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
